[project]
name = "festival-intelligent"
version = "0.2.0"
description = "Système intelligent de gestion de festival musical — SAE S8 SCIA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15",
    "timesfm>=2.0",
    "opencv-python-headless>=4.8",
    "ortools>=9.7",
    "simpy>=4.1",
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.7"]
groq   = ["groq>=0.9"]
